name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Check Python lock
        run: uv lock --check --project training/local-runner

      - name: Check Python syntax
        run: python3 -m compileall -q training/local-runner/src training/local-runner/tests

      - name: Test Python SFT data
        run: python3 -m unittest discover -s training/local-runner/tests -p 'test_*.py'

      - name: Smoke-test Python runtime imports
        run: |
          uv run --frozen --project training/local-runner python -c \
            "import sys; sys.path.insert(0, 'training/local-runner/src'); import evaluate, prefetch, sft_data, train; evaluate.import_runtime_dependencies(); print('python runtime imports ok')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run
